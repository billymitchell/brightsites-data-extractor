<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>BrightSites Exporter</title>
    <style>
        body {
            font-family: system-ui, -apple-system, Arial;
            margin: 24px;
        }

        label {
            display: block;
            margin-top: 8px
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 12px
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 6px;
            font-size: 13px
        }

        th {
            background: #f3f3f3
        }

        #preview {
            max-height: 500px;
            overflow: auto
        }

        #previewMeta {
            margin-top: 12px;
            color: #666;
            font-size: 13px;
        }

        button {
            padding: 8px 12px
        }

        .inline-check {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 0;
        }

        .job-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.68);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 1000;
        }

        .job-overlay[hidden] {
            display: none;
        }

        .job-card {
            width: min(480px, 100%);
            background: #fff;
            border-radius: 18px;
            padding: 28px 24px;
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.24);
            text-align: center;
        }

        .job-spinner {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 4px solid #dbe4f0;
            border-top-color: #0f766e;
            margin: 0 auto 18px;
            animation: spin 0.9s linear infinite;
        }

        .job-card h3 {
            margin: 0 0 10px;
            font-size: 22px;
        }

        .job-card p {
            margin: 0;
        }

        .job-message {
            color: #1f2937;
            font-size: 15px;
        }

        .job-progress {
            margin-top: 10px !important;
            color: #5b6472;
            font-size: 13px;
            min-height: 18px;
        }

        .job-actions {
            margin-top: 18px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .job-actions button[disabled] {
            opacity: 0.6;
            cursor: not-allowed;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <h2>BrightSites CSV Export</h2>
    <div class="controls">
        <div>
            <label>Store
                <select id="storeSelect">
                    <option>Loading...</option>
                </select>
            </label>
        </div>
        <div>

        </div>
        <div>
            <label>Date Preset
                <select id="datePreset">
                    <option value="custom">Custom</option>
                    <option value="last7">Last 7 days</option>
                    <option value="last30">Last 30 days</option>
                    <option value="yearToDate">Year to Date</option>
                    <option value="thisMonth">This Month</option>
                    <option value="lastMonth">Last Month</option>
                </select>
            </label>
        </div>

        <div>
            <label>Status (optional)
                <select id="statusSelect" multiple size="9">
                    <option value="all" selected>All</option>
                    <option value="New">New</option>
                    <option value="Billed">Billed</option>
                    <option value="Paid">Paid</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Split">Split</option>
                    <option value="Shipped">Shipped</option>
                    <option value="Completed">Completed</option>
                    <option value="Back Ordered">Back Ordered</option>
                    <option value="Canceled">Canceled</option>
                    <option value="MOAS Pending">MOAS Pending</option>
                </select>
                <small style="display:block;color:#666;margin-top:4px">Use Cmd/Ctrl+Click to select multiple</small>
            </label>
        </div>
        <div>
            <label>Start (required)
                <input type="date" id="start" required />
            </label>
            <label>End (required)
                <input type="date" id="end" required />
            </label>
        </div>
        <div style="align-self:end">
            <button id="run">Run</button>
            <button id="download" disabled>Download CSV</button>
        </div>
        <div style="align-self:end">
            <label class="inline-check">
                <input type="checkbox" id="danielleFormat" />
                Danielle's Format
            </label>
        </div>
    </div>

    <div id="meta"></div>
    <div id="previewMeta"></div>
    <div id="preview"></div>
    <div id="jobOverlay" class="job-overlay" hidden>
        <div class="job-card">
            <div id="jobSpinner" class="job-spinner" aria-hidden="true"></div>
            <h3 id="jobTitle">Building report</h3>
            <p id="jobMessage" class="job-message">Preparing your request.</p>
            <p id="jobProgress" class="job-progress"></p>
            <div class="job-actions">
                <button id="cancelJob" type="button">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // Column configuration and usage sections removed; preview uses all server-provided columns.

        let fullResult = null;
        let activeJobId = null;
        let activeJobPollTimer = null;
        let cancelRequested = false;
        const PREVIEW_ROW_LIMIT = 50;
        const JOB_POLL_INTERVAL_MS = 1500;
        const DANIELLE_COLUMNS = [
            'Order #',
            'Placed',
            'Order Status',
            'Line Item ID',
            'Billing Month',
            'Tracking #',
            'Product Personalization',
            'Quantity',
            'Shipping Company',
            'Shipping Address 1',
            'Shipping Address 2',
            'Shipping City',
            'Shipping State',
            'Shipping Country',
            'Shipping Zip Code',
            'Product Name',
            'Product Options',
            'Award Level',
            'Award Type',
            'SKU',
            'Unit Price',
            'Total Price',
            'Tax Total',
            'Order Total'
        ];
        const DANIELLE_SOURCE_MAP = {
            'Shipping Address 1': 'Shipping Address1',
            'Shipping Address 2': 'Shipping Address2',
            'Shipping Zip Code': 'Shipping Zip',
            'Quantity': 'Original Quantity'
        };
        const runButton = document.getElementById('run');
        const downloadButton = document.getElementById('download');
        const metaEl = document.getElementById('meta');
        const previewEl = document.getElementById('preview');
        const previewMetaEl = document.getElementById('previewMeta');
        const jobOverlayEl = document.getElementById('jobOverlay');
        const jobSpinnerEl = document.getElementById('jobSpinner');
        const jobTitleEl = document.getElementById('jobTitle');
        const jobMessageEl = document.getElementById('jobMessage');
        const jobProgressEl = document.getElementById('jobProgress');
        const cancelJobButton = document.getElementById('cancelJob');

        function setJobOverlayVisible(visible) {
            jobOverlayEl.hidden = !visible;
        }

        function clearActiveJobPollTimer() {
            if (!activeJobPollTimer) return;
            clearTimeout(activeJobPollTimer);
            activeJobPollTimer = null;
        }

        function setJobControlState() {
            runButton.disabled = Boolean(activeJobId);
            cancelJobButton.disabled = !activeJobId || cancelRequested;
            cancelJobButton.textContent = cancelRequested ? 'Canceling...' : 'Cancel';
        }

        function resetResultState() {
            fullResult = null;
            downloadButton.disabled = true;
            previewEl.innerHTML = '';
            previewMetaEl.textContent = '';
        }

        function formatJobProgress(job) {
            const progress = job && job.progress ? job.progress : {};
            const parts = [];

            if (typeof progress.ordersProcessed === 'number' && typeof progress.ordersTotal === 'number' && progress.ordersTotal > 0) {
                parts.push(`${progress.ordersProcessed} of ${progress.ordersTotal} orders processed`);
            } else if (typeof progress.ordersFetched === 'number' && progress.ordersFetched > 0) {
                parts.push(`${progress.ordersFetched} orders fetched`);
            }

            if (typeof progress.rowsBuilt === 'number' && progress.rowsBuilt > 0) {
                parts.push(`${progress.rowsBuilt} rows built`);
            }

            if (typeof progress.statusesTotal === 'number' && progress.statusesTotal > 1) {
                const currentStatusIndex = progress.currentStatus
                    ? Math.min(progress.statusesProcessed + 1, progress.statusesTotal)
                    : Math.min(progress.statusesProcessed || 0, progress.statusesTotal);
                if (currentStatusIndex > 0) {
                    parts.push(`Status ${currentStatusIndex} of ${progress.statusesTotal}`);
                }
            }

            return parts.join(' • ');
        }

        function getJobTitle(job) {
            if (!job) return 'Building report';
            if (job.status === 'queued') return 'Queued report';
            if (job.status === 'canceling') return 'Canceling report';
            if (job.status === 'completed') return 'Report ready';
            if (job.status === 'failed') return 'Report failed';
            if (job.status === 'canceled') return 'Report canceled';
            return 'Building report';
        }

        function updateJobOverlay(job) {
            jobTitleEl.textContent = getJobTitle(job);
            jobMessageEl.textContent = (job && job.progress && job.progress.message) || 'Working...';
            jobProgressEl.textContent = formatJobProgress(job);
            cancelJobButton.hidden = !job || ['completed', 'failed', 'canceled'].includes(job.status);
            jobSpinnerEl.hidden = job && ['completed', 'failed', 'canceled'].includes(job.status);
            cancelRequested = Boolean(job && (job.cancelRequested || job.status === 'canceling'));
            setJobControlState();
        }

        async function readErrorResponse(res) {
            const text = await res.text();
            if (!text) return `${res.status} ${res.statusText}`;
            try {
                const json = JSON.parse(text);
                return json.error || text;
            } catch (err) {
                return text;
            }
        }

        function completeActiveJob() {
            activeJobId = null;
            cancelRequested = false;
            clearActiveJobPollTimer();
            setJobControlState();
        }

        function activateJob(job) {
            activeJobId = job.id;
            cancelRequested = Boolean(job.cancelRequested);
            setJobOverlayVisible(true);
            updateJobOverlay(job);
        }

        async function loadCompletedJob(job) {
            jobTitleEl.textContent = 'Report ready';
            jobMessageEl.textContent = 'Loading completed report results.';
            jobProgressEl.textContent = '';
            cancelJobButton.hidden = true;
            jobSpinnerEl.hidden = false;

            const res = await fetch(job.resultUrl || `/api/run/${job.id}/result`);
            if (!res.ok) throw new Error(await readErrorResponse(res));

            const result = await res.json();
            fullResult = result;
            renderPreview(result);
            downloadButton.disabled = false;
            metaEl.textContent = `Orders: ${result.meta.orders}  Rows: ${result.meta.rows}`;
            setJobOverlayVisible(false);
            completeActiveJob();
        }

        async function pollJob(jobId) {
            clearActiveJobPollTimer();
            if (!jobId) return;

            try {
                const res = await fetch(`/api/run/${jobId}`);
                if (!res.ok) throw new Error(await readErrorResponse(res));

                const job = await res.json();
                if (job.id !== activeJobId) return;

                updateJobOverlay(job);

                if (job.status === 'completed') {
                    await loadCompletedJob(job);
                    return;
                }

                if (job.status === 'failed') {
                    setJobOverlayVisible(false);
                    completeActiveJob();
                    metaEl.textContent = `Error: ${job.error || 'Report job failed.'}`;
                    previewMetaEl.textContent = '';
                    return;
                }

                if (job.status === 'canceled') {
                    setJobOverlayVisible(false);
                    completeActiveJob();
                    metaEl.textContent = 'Report canceled.';
                    previewMetaEl.textContent = '';
                    return;
                }

                activeJobPollTimer = setTimeout(() => {
                    pollJob(jobId);
                }, JOB_POLL_INTERVAL_MS);
            } catch (err) {
                console.error(err);
                setJobOverlayVisible(false);
                completeActiveJob();
                metaEl.textContent = 'Error: ' + err.message;
                previewMetaEl.textContent = '';
            }
        }

        function applyPreset(p) {
            const today = new Date();
            let start, end;
            if (p === 'last7') {
                end = new Date(today);
                start = new Date(today);
                start.setDate(start.getDate() - 7);
            } else if (p === 'last30') {
                end = new Date(today);
                start = new Date(today);
                start.setDate(start.getDate() - 30);
            } else if (p === 'yearToDate') {
                start = new Date(today.getFullYear(), 0, 1);
                end = new Date(today);
            } else if (p === 'thisMonth') {
                start = new Date(today.getFullYear(), today.getMonth(), 1);
                end = new Date(today);
            } else if (p === 'lastMonth') {
                start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
                end = new Date(today.getFullYear(), today.getMonth(), 0);
            }
            if (start && end) {
                document.getElementById('start').value = start.toISOString().slice(0, 10);
                document.getElementById('end').value = end.toISOString().slice(0, 10);
            }
        }

        document.getElementById('datePreset').addEventListener('change', (e) => {
            if (e.target.value === 'custom') return;
            applyPreset(e.target.value);
        });

        runButton.addEventListener('click', async () => {
            if (activeJobId) return;

            const statusEl = document.getElementById('statusSelect');
            let statuses = Array.from(statusEl ? statusEl.selectedOptions : []).map(o => o.value);

            // If "all" is selected or nothing is selected, don't send status filter
            if (statuses.includes('all') || statuses.length === 0) {
                statuses = [];
            }

            const start = document.getElementById('start').value;
            const end = document.getElementById('end').value;
            const storeKey = document.getElementById('storeSelect').value;

            // require explicit store selection
            if (!storeKey) {
                metaEl.textContent = 'Please select a store before running the report.';
                return;
            }

            // require date range
            if (!start || !end) {
                metaEl.textContent = 'Both start and end dates are required.';
                return;
            }

            const payload = {
                storeKey: storeKey,
                start: start,
                end: end
            };
            if (statuses && statuses.length) payload.status = statuses.join(',');

            resetResultState();
            runButton.disabled = true;
            metaEl.textContent = 'Queueing report job...';
            try {
                const res = await fetch('/api/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!res.ok) throw new Error(await readErrorResponse(res));
                const job = await res.json();
                activateJob(job);
                metaEl.textContent = 'Report queued. This screen will update while it runs.';
                pollJob(job.id);
            } catch (err) {
                console.error(err);
                metaEl.textContent = 'Error: ' + err.message;
            } finally {
                if (!activeJobId) setJobControlState();
            }
        });

        function renderPreview(result) {
            const preview = document.getElementById('preview');
            const previewMeta = document.getElementById('previewMeta');
            preview.innerHTML = '';
            const view = buildViewData(result);
            const visible = view.columns;
            const table = document.createElement('table');
            const thead = document.createElement('thead');
            const tr = document.createElement('tr');
            visible.forEach(c => { const th = document.createElement('th'); th.textContent = c; tr.appendChild(th); });
            thead.appendChild(tr);
            table.appendChild(thead);
            const tbody = document.createElement('tbody');
            const rows = view.rows.slice(0, PREVIEW_ROW_LIMIT);
            if (view.rows.length > PREVIEW_ROW_LIMIT) {
                previewMeta.textContent = `Preview is truncated. Showing ${rows.length} of ${view.rows.length} rows. Download CSV to get the full result.`;
            } else {
                previewMeta.textContent = `Preview is showing all ${view.rows.length} rows returned by the server.`;
            }
            rows.forEach(r => {
                const tr = document.createElement('tr');
                visible.forEach((colName, idx) => {
                    const td = document.createElement('td');
                    td.textContent = (idx >= 0 && r[idx] != null) ? r[idx] : '';
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            preview.appendChild(table);
        }

        function buildViewData(result) {
            const useDanielle = document.getElementById('danielleFormat').checked;
            if (!useDanielle) return { columns: result.columns, rows: result.rows };

            const sourceIndexByName = {};
            result.columns.forEach((name, idx) => { sourceIndexByName[name] = idx; });

            const mappedRows = result.rows.map(r => {
                return DANIELLE_COLUMNS.map(targetCol => {
                    const sourceCol = DANIELLE_SOURCE_MAP[targetCol] || targetCol;
                    const sourceIdx = sourceIndexByName[sourceCol];
                    return (sourceIdx != null && sourceIdx >= 0 && r[sourceIdx] != null) ? r[sourceIdx] : '';
                });
            });

            return { columns: DANIELLE_COLUMNS, rows: mappedRows };
        }

        function escapeCsvCell(v) {
            if (v == null) return '';
            const s = String(v);
            if (s.includes(',') || s.includes('\"') || s.includes('\n') || s.includes('\r') || s.includes('"')) {
                return '"' + s.replace(/"/g, '""') + '"';
            }
            return s;
        }

        downloadButton.addEventListener('click', () => {
            if (!fullResult) return;
            const view = buildViewData(fullResult);
            const rows = view.rows;
            const visible = view.columns;
            const lines = [];
            lines.push(visible.map(escapeCsvCell).join(','));
            rows.forEach(r => {
                const out = visible.map((colName, idx) => idx >= 0 ? escapeCsvCell(r[idx]) : '');
                lines.push(out.join(','));
            });
            const csv = lines.join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'brightsites_export.csv';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        });

        cancelJobButton.addEventListener('click', async () => {
            if (!activeJobId || cancelRequested) return;

            cancelRequested = true;
            setJobControlState();
            jobMessageEl.textContent = 'Cancel requested. Waiting for the active BrightSites request to finish.';
            jobProgressEl.textContent = '';

            try {
                const res = await fetch(`/api/run/${activeJobId}/cancel`, { method: 'POST' });
                if (!res.ok) throw new Error(await readErrorResponse(res));

                const job = await res.json();
                updateJobOverlay(job);
                metaEl.textContent = 'Cancel requested. The job will stop after the current request finishes.';
            } catch (err) {
                console.error(err);
                cancelRequested = false;
                setJobControlState();
                metaEl.textContent = 'Error canceling report: ' + err.message;
            }
        });

        // load stores into selector
        async function loadStores() {
            try {
                const res = await fetch('/api/stores');
                const stores = await res.json();
                const sel = document.getElementById('storeSelect');
                sel.innerHTML = '';
                const placeholder = document.createElement('option');
                placeholder.value = '';
                placeholder.textContent = '-- select a store --';
                placeholder.disabled = true;
                placeholder.selected = true;
                sel.appendChild(placeholder);
                stores.forEach(s => {
                    const o = document.createElement('option');
                    o.value = s.key;
                    o.textContent = s.label + (s.subdomain ? ` (${s.subdomain})` : '');
                    sel.appendChild(o);
                });
                // No usage refresh needed
            } catch (err) {
                console.error('loadStores', err);
            }
        }
        loadStores();

        document.getElementById('danielleFormat').addEventListener('change', () => {
            if (fullResult) renderPreview(fullResult);
        });

        setJobControlState();

        // Column configuration removed; always show all columns returned by the server.
    </script>
</body>

</html>
