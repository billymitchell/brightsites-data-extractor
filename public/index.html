<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BrightSites Exporter</title>
    <link rel="stylesheet" href="/vendor/pico.min.css" />
    <style>
        :root { --pico-font-size: 95%; }
        .app-header { margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
        .app-header h1 { margin: 0; font-size: 1.6rem; }
        .app-header a[role=button] { margin: 0; width: auto; }
        .app-header form, .app-header button { margin: 0; width: auto; }
        #columnGroups fieldset { margin-top: 1rem; } #columnGroups fieldset label { display: inline-block; width: 240px; margin-right: .5rem; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0 1rem; align-items: start; }
        .actions { display: flex; gap: .75rem; flex-wrap: wrap; }
        .actions button { width: auto; }
        #statusGroup { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); column-gap: 1rem; }
        #statusGroup legend, #statusGroup small { grid-column: 1 / -1; }
        #preview { max-height: 500px; overflow: auto; }
        #preview table { font-size: .8rem; margin: 0; }
        #previewMeta, #meta { color: var(--pico-muted-color); font-size: .85rem; margin: .5rem 0; }
        .job-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, .68); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 1000; }
        .job-overlay[hidden] { display: none; }
        .job-card { width: min(480px, 100%); text-align: center; margin: 0; }
        .job-spinner { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--pico-muted-border-color); border-top-color: var(--pico-primary); margin: 0 auto 18px; animation: spin .9s linear infinite; }
        .job-card h3 { margin-bottom: .5rem; }
        .job-card p { margin: 0; }
        .job-progress { margin-top: 10px !important; color: var(--pico-muted-color); font-size: .85rem; min-height: 18px; }
        .job-actions { margin-top: 1.2rem; display: flex; justify-content: center; }
        .job-actions button { width: auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body>
    <main class="container">
        <header class="app-header">
            <h1>BrightSites CSV Export</h1>
            <div class="actions"><a href="/api/diagnostics/report" role="button" class="outline secondary" download>Download support info</a><form method="post" action="/logout"><button type="submit" class="outline secondary">Sign out</button></form></div>
        </header>

        <article>
            <div class="form-grid">
                <label>Store
                    <select id="storeSelect"><option>Loading...</option></select>
                </label>
                <label>Date Preset
                    <select id="datePreset">
                        <option value="custom">Custom</option>
                        <option value="last7">Last 7 days</option>
                        <option value="last30">Last 30 days</option>
                        <option value="yearToDate">Year to Date</option>
                        <option value="thisMonth">This Month</option>
                        <option value="lastMonth">Last Month</option>
                    </select>
                </label>
                <label>Start (required)
                    <input type="date" id="start" required />
                </label>
                <label>End (required)
                    <input type="date" id="end" required />
                </label>
                
            </div>
            <fieldset id="statusGroup">
                    <legend>Status (optional)</legend>
                        <label><input type="checkbox" name="status" value="New" /> New</label>
                        <label><input type="checkbox" name="status" value="Billed" /> Billed</label>
                        <label><input type="checkbox" name="status" value="Paid" /> Paid</label>
                        <label><input type="checkbox" name="status" value="In Progress" /> In Progress</label>
                        <label><input type="checkbox" name="status" value="Split" /> Split</label>
                        <label><input type="checkbox" name="status" value="Shipped" /> Shipped</label>
                        <label><input type="checkbox" name="status" value="Completed" /> Completed</label>
                        <label><input type="checkbox" name="status" value="Back Ordered" /> Back Ordered</label>
                        <label><input type="checkbox" name="status" value="Canceled" /> Canceled</label>
                        <label><input type="checkbox" name="status" value="MOAS Pending" /> MOAS Pending</label>
                    <small>Leave all unchecked for every status.</small>
                </fieldset>
            <label>
                <input type="checkbox" id="danielleFormat" role="switch" />
                Danielle's Format
            </label>
            <label>
                <input type="checkbox" id="includeUps" role="switch" />
                Add UPS tracking data (status, service, weight, delivery date)
            </label>
            <details id="columnPicker" open>
                <summary>Choose report columns <small id="columnCount"></small></summary>
                <div class="actions">
                    <button type="button" class="secondary outline" id="colsAll">Select all</button>
                    <button type="button" class="secondary outline" id="colsCore">Core columns</button>
                    <button type="button" class="secondary outline" id="colsNone">Clear</button>
                </div>
                <small>Applies to the preview and CSV download. Not used with Danielle's Format.</small>
                <div id="columnGroups"></div>
            </details>
            <div class="actions">
                <button id="run">Run</button>
                <button id="download" class="secondary" disabled>Download CSV</button>
            </div>
        </article>

        <div id="meta"></div>
        <div id="previewMeta"></div>
        <div id="preview"></div>
    </main>

    <div id="jobOverlay" class="job-overlay" hidden>
        <article class="job-card" role="dialog" aria-modal="true" aria-labelledby="jobTitle">
            <div id="jobSpinner" class="job-spinner" aria-hidden="true"></div>
            <h3 id="jobTitle">Building report</h3>
            <p id="jobMessage" class="job-message">Preparing your request.</p>
            <p id="jobProgress" class="job-progress"></p>
            <div class="job-actions">
                <button id="cancelJob" type="button" class="secondary">Cancel</button>
            </div>
        </article>
    </div>

    <script src="/csv.js"></script>
    <script>
        const _origFetch = window.fetch.bind(window);
        window.fetch = async (...args) => {
            const r = await _origFetch(...args);
            if (r.status === 401) { window.location.href = '/login'; }
            return r;
        };
        let clientEventsSent = 0;
        function reportClientError(message) {
            if (clientEventsSent++ >= 10) return;
            _origFetch('/api/diagnostics/client-event', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message, page: location.pathname }) }).catch(() => {});
        }
        window.addEventListener('error', (e) => reportClientError(e.message));
        window.addEventListener('unhandledrejection', (e) => reportClientError(String(e.reason)));
        // Column configuration and usage sections removed; preview uses all server-provided columns.

        let fullResult = null;
        let activeJobId = null;
        let activeJobPollTimer = null;
        let cancelRequested = false;
        const PREVIEW_ROW_LIMIT = 50;
        const JOB_POLL_INTERVAL_MS = 1500;
        const DANIELLE_COLUMNS = [
            'Order #',
            'Placed',
            'Order Status',
            'Line Item ID',
            'Billing Month',
            'Tracking #',
            'Product Personalization',
            'Quantity',
            'Shipping Company',
            'Shipping Address 1',
            'Shipping Address 2',
            'Shipping City',
            'Shipping State',
            'Shipping Zip Code',
            'Shipping Country',
            'Product Name',
            'Product Options',
            'Award Level',
            'Award Type',
            'SKU',
            'Unit Price',
            'Total Price',
            'Tax Total',
            'Order Total'
        ];
        const DANIELLE_SOURCE_MAP = {
            'Shipping Address 1': 'Shipping Address1',
            'Shipping Address 2': 'Shipping Address2',
            'Shipping Zip Code': 'Shipping Zip',
            'Quantity': 'Original Quantity'
        };
        const runButton = document.getElementById('run');
        const downloadButton = document.getElementById('download');
        const metaEl = document.getElementById('meta');
        const previewEl = document.getElementById('preview');
        const previewMetaEl = document.getElementById('previewMeta');
        const jobOverlayEl = document.getElementById('jobOverlay');
        const jobSpinnerEl = document.getElementById('jobSpinner');
        const jobTitleEl = document.getElementById('jobTitle');
        const jobMessageEl = document.getElementById('jobMessage');
        const jobProgressEl = document.getElementById('jobProgress');
        const cancelJobButton = document.getElementById('cancelJob');

        function setJobOverlayVisible(visible) {
            jobOverlayEl.hidden = !visible;
        }

        function clearActiveJobPollTimer() {
            if (!activeJobPollTimer) return;
            clearTimeout(activeJobPollTimer);
            activeJobPollTimer = null;
        }

        function setJobControlState() {
            runButton.disabled = Boolean(activeJobId);
            cancelJobButton.disabled = !activeJobId || cancelRequested;
            cancelJobButton.textContent = cancelRequested ? 'Canceling...' : 'Cancel';
        }

        function resetResultState() {
            fullResult = null;
            downloadButton.disabled = true;
            previewEl.innerHTML = '';
            previewMetaEl.textContent = '';
        }

        function formatJobProgress(job) {
            const progress = job && job.progress ? job.progress : {};
            const parts = [];

            if (typeof progress.ordersProcessed === 'number' && typeof progress.ordersTotal === 'number' && progress.ordersTotal > 0) {
                parts.push(`${progress.ordersProcessed} of ${progress.ordersTotal} orders processed`);
            } else if (typeof progress.ordersFetched === 'number' && progress.ordersFetched > 0) {
                parts.push(`${progress.ordersFetched} orders fetched`);
            }

            if (typeof progress.rowsBuilt === 'number' && progress.rowsBuilt > 0) {
                parts.push(`${progress.rowsBuilt} rows built`);
            }

            if (typeof progress.statusesTotal === 'number' && progress.statusesTotal > 1) {
                const currentStatusIndex = progress.currentStatus
                    ? Math.min(progress.statusesProcessed + 1, progress.statusesTotal)
                    : Math.min(progress.statusesProcessed || 0, progress.statusesTotal);
                if (currentStatusIndex > 0) {
                    parts.push(`Status ${currentStatusIndex} of ${progress.statusesTotal}`);
                }
            }

            return parts.join(' • ');
        }

        function getJobTitle(job) {
            if (!job) return 'Building report';
            if (job.status === 'queued') return 'Queued report';
            if (job.status === 'canceling') return 'Canceling report';
            if (job.status === 'completed') return 'Report ready';
            if (job.status === 'failed') return 'Report failed';
            if (job.status === 'canceled') return 'Report canceled';
            return 'Building report';
        }

        function updateJobOverlay(job) {
            jobTitleEl.textContent = getJobTitle(job);
            jobMessageEl.textContent = (job && job.progress && job.progress.message) || 'Working...';
            jobProgressEl.textContent = formatJobProgress(job);
            cancelJobButton.hidden = !job || ['completed', 'failed', 'canceled'].includes(job.status);
            jobSpinnerEl.hidden = job && ['completed', 'failed', 'canceled'].includes(job.status);
            cancelRequested = Boolean(job && (job.cancelRequested || job.status === 'canceling'));
            setJobControlState();
        }

        async function readErrorResponse(res) {
            const text = await res.text();
            if (!text) return `${res.status} ${res.statusText}`;
            try {
                const json = JSON.parse(text);
                return json.error || text;
            } catch (err) {
                return text;
            }
        }

        function completeActiveJob() {
            activeJobId = null;
            cancelRequested = false;
            clearActiveJobPollTimer();
            setJobControlState();
        }

        function activateJob(job) {
            activeJobId = job.id;
            cancelRequested = Boolean(job.cancelRequested);
            setJobOverlayVisible(true);
            updateJobOverlay(job);
        }

        async function loadCompletedJob(job) {
            jobTitleEl.textContent = 'Report ready';
            jobMessageEl.textContent = 'Loading completed report results.';
            jobProgressEl.textContent = '';
            cancelJobButton.hidden = true;
            jobSpinnerEl.hidden = false;

            const res = await fetch(job.resultUrl || `/api/run/${job.id}/result`);
            if (!res.ok) throw new Error(await readErrorResponse(res));

            const result = await res.json();
            fullResult = result;
            renderPreview(result);
            downloadButton.disabled = false;
            metaEl.textContent = `Orders: ${result.meta.orders}  Rows: ${result.meta.rows}`;
            setJobOverlayVisible(false);
            completeActiveJob();
        }

        async function pollJob(jobId) {
            clearActiveJobPollTimer();
            if (!jobId) return;

            try {
                const res = await fetch(`/api/run/${jobId}`);
                if (!res.ok) throw new Error(await readErrorResponse(res));

                const job = await res.json();
                if (job.id !== activeJobId) return;

                updateJobOverlay(job);

                if (job.status === 'completed') {
                    await loadCompletedJob(job);
                    return;
                }

                if (job.status === 'failed') {
                    setJobOverlayVisible(false);
                    completeActiveJob();
                    metaEl.textContent = `Error: ${job.error || 'Report job failed.'}`;
                    previewMetaEl.textContent = '';
                    return;
                }

                if (job.status === 'canceled') {
                    setJobOverlayVisible(false);
                    completeActiveJob();
                    metaEl.textContent = 'Report canceled.';
                    previewMetaEl.textContent = '';
                    return;
                }

                activeJobPollTimer = setTimeout(() => {
                    pollJob(jobId);
                }, JOB_POLL_INTERVAL_MS);
            } catch (err) {
                console.error(err);
                setJobOverlayVisible(false);
                completeActiveJob();
                metaEl.textContent = 'Error: ' + err.message;
                previewMetaEl.textContent = '';
            }
        }

        function applyPreset(p) {
            const today = new Date();
            let start, end;
            if (p === 'last7') {
                end = new Date(today);
                start = new Date(today);
                start.setDate(start.getDate() - 7);
            } else if (p === 'last30') {
                end = new Date(today);
                start = new Date(today);
                start.setDate(start.getDate() - 30);
            } else if (p === 'yearToDate') {
                start = new Date(today.getFullYear(), 0, 1);
                end = new Date(today);
            } else if (p === 'thisMonth') {
                start = new Date(today.getFullYear(), today.getMonth(), 1);
                end = new Date(today);
            } else if (p === 'lastMonth') {
                start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
                end = new Date(today.getFullYear(), today.getMonth(), 0);
            }
            if (start && end) {
                document.getElementById('start').value = start.toISOString().slice(0, 10);
                document.getElementById('end').value = end.toISOString().slice(0, 10);
            }
        }

        document.getElementById('datePreset').addEventListener('change', (e) => {
            if (e.target.value === 'custom') return;
            applyPreset(e.target.value);
        });

        runButton.addEventListener('click', async () => {
            if (activeJobId) return;

            let statuses = Array.from(document.querySelectorAll('#statusGroup input[name=status]:checked')).map(o => o.value);

            // If "all" is selected or nothing is selected, don't send status filter
            if (statuses.includes('all') || statuses.length === 0) {
                statuses = [];
            }

            const start = document.getElementById('start').value;
            const end = document.getElementById('end').value;
            const storeKey = document.getElementById('storeSelect').value;

            // require explicit store selection
            if (!storeKey) {
                metaEl.textContent = 'Please select a store before running the report.';
                return;
            }

            // require date range
            if (!start || !end) {
                metaEl.textContent = 'Both start and end dates are required.';
                return;
            }

            const payload = {
                storeKey: storeKey,
                start: start,
                end: end
            };
            if (document.getElementById('includeUps').checked) payload.includeUps = true;
            if (statuses && statuses.length) payload.status = statuses.join(',');

            resetResultState();
            runButton.disabled = true;
            metaEl.textContent = 'Queueing report job...';
            try {
                const res = await fetch('/api/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!res.ok) throw new Error(await readErrorResponse(res));
                const job = await res.json();
                activateJob(job);
                metaEl.textContent = 'Report queued. This screen will update while it runs.';
                pollJob(job.id);
            } catch (err) {
                console.error(err);
                metaEl.textContent = 'Error: ' + err.message;
            } finally {
                if (!activeJobId) setJobControlState();
            }
        });

        function renderPreview(result) {
            const preview = document.getElementById('preview');
            const previewMeta = document.getElementById('previewMeta');
            preview.innerHTML = '';
            const view = buildViewData(result);
            const visible = view.columns;
            const table = document.createElement('table');
            const thead = document.createElement('thead');
            const tr = document.createElement('tr');
            visible.forEach(c => { const th = document.createElement('th'); th.textContent = c; tr.appendChild(th); });
            thead.appendChild(tr);
            table.appendChild(thead);
            const tbody = document.createElement('tbody');
            const rows = view.rows.slice(0, PREVIEW_ROW_LIMIT);
            if (view.rows.length > PREVIEW_ROW_LIMIT) {
                previewMeta.textContent = `Preview is truncated. Showing ${rows.length} of ${view.rows.length} rows. Download CSV to get the full result.`;
            } else {
                previewMeta.textContent = `Preview is showing all ${view.rows.length} rows returned by the server.`;
            }
            rows.forEach(r => {
                const tr = document.createElement('tr');
                visible.forEach((colName, idx) => {
                    const td = document.createElement('td');
                    td.textContent = (idx >= 0 && r[idx] != null) ? r[idx] : '';
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            preview.appendChild(table);
        }

        const COLUMN_STORAGE_KEY = 'brightsites_deselected_columns_v2';
        let deselectedColumns = new Set();
        try { deselectedColumns = new Set(JSON.parse(localStorage.getItem(COLUMN_STORAGE_KEY) || '[]')); } catch (e) { /* ignore */ }
        let columnCatalog = { groups: [], core: [] };

        function saveColumnSelection() {
            try { localStorage.setItem(COLUMN_STORAGE_KEY, JSON.stringify([...deselectedColumns])); } catch (e) { /* ignore */ }
            const total = columnCatalog.groups.reduce((n, g) => n + g.columns.length, 0);
            document.getElementById('columnCount').textContent = total ? `(${total - deselectedColumns.size} of ${total} selected)` : '';
            if (fullResult) renderPreview(fullResult);
        }

        function syncColumnCheckboxes() {
            document.querySelectorAll('#columnGroups input[type=checkbox]').forEach(cb => { cb.checked = !deselectedColumns.has(cb.dataset.col); });
        }

        function setSelection(selectedNames) {
            const all = columnCatalog.groups.flatMap(g => g.columns);
            deselectedColumns = new Set(all.filter(c => !selectedNames.includes(c)));
            syncColumnCheckboxes();
            saveColumnSelection();
        }

        async function loadColumnPicker() {
            try {
                const res = await fetch('/api/columns');
                if (!res.ok) return;
                columnCatalog = await res.json();
            } catch (err) { console.error('loadColumnPicker', err); return; }
            const host = document.getElementById('columnGroups');
            host.innerHTML = '';
            columnCatalog.groups.forEach(group => {
                const fs = document.createElement('fieldset');
                const legend = document.createElement('legend');
                legend.textContent = group.label;
                fs.appendChild(legend);
                group.columns.forEach(col => {
                    const label = document.createElement('label');
                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.dataset.col = col;
                    cb.addEventListener('change', () => {
                        if (cb.checked) deselectedColumns.delete(col); else deselectedColumns.add(col);
                        saveColumnSelection();
                    });
                    label.appendChild(cb);
                    label.appendChild(document.createTextNode(' ' + col));
                    fs.appendChild(label);
                });
                host.appendChild(fs);
            });
            syncColumnCheckboxes();
            saveColumnSelection();
        }
        document.getElementById('colsAll').addEventListener('click', () => setSelection(columnCatalog.groups.flatMap(g => g.columns)));
        document.getElementById('colsNone').addEventListener('click', () => setSelection([]));
        document.getElementById('colsCore').addEventListener('click', () => setSelection(columnCatalog.core));
        loadColumnPicker();

        function buildViewData(result) {
            const useDanielle = document.getElementById('danielleFormat').checked;
            if (!useDanielle) {
                const keep = [];
                result.columns.forEach((name, idx) => { if (!deselectedColumns.has(name)) keep.push(idx); });
                return {
                    columns: keep.map(i => result.columns[i]),
                    rows: result.rows.map(r => keep.map(i => r[i]))
                };
            }

            const sourceIndexByName = {};
            result.columns.forEach((name, idx) => { sourceIndexByName[name] = idx; });

            const upsCols = result.columns.filter(c => c.startsWith('UPS ') || c === 'Expected Delivery Date');
            const targetColumns = DANIELLE_COLUMNS.concat(upsCols);
            const mappedRows = result.rows.map(r => {
                return targetColumns.map(targetCol => {
                    const sourceCol = DANIELLE_SOURCE_MAP[targetCol] || targetCol;
                    const sourceIdx = sourceIndexByName[sourceCol];
                    return (sourceIdx != null && sourceIdx >= 0 && r[sourceIdx] != null) ? r[sourceIdx] : '';
                });
            });

            return { columns: targetColumns, rows: mappedRows };
        }

        downloadButton.addEventListener('click', () => {
            if (!fullResult) return;
            const view = buildViewData(fullResult);
            const rows = view.rows;
            const visible = view.columns;
            const lines = [];
            lines.push(visible.map(BrightSitesCsv.escapeCsvCell).join(','));
            rows.forEach(r => {
                const out = visible.map((colName, idx) => idx >= 0 ? BrightSitesCsv.escapeCsvCell(r[idx]) : '');
                lines.push(out.join(','));
            });
            const csv = lines.join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'brightsites_export.csv';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        });

        cancelJobButton.addEventListener('click', async () => {
            if (!activeJobId || cancelRequested) return;

            cancelRequested = true;
            setJobControlState();
            jobMessageEl.textContent = 'Cancel requested. Waiting for the active BrightSites request to finish.';
            jobProgressEl.textContent = '';

            try {
                const res = await fetch(`/api/run/${activeJobId}/cancel`, { method: 'POST' });
                if (!res.ok) throw new Error(await readErrorResponse(res));

                const job = await res.json();
                updateJobOverlay(job);
                metaEl.textContent = 'Cancel requested. The job will stop after the current request finishes.';
            } catch (err) {
                console.error(err);
                cancelRequested = false;
                setJobControlState();
                metaEl.textContent = 'Error canceling report: ' + err.message;
            }
        });

        // load stores into selector
        async function loadStores() {
            try {
                const res = await fetch('/api/stores');
                const stores = await res.json();
                const sel = document.getElementById('storeSelect');
                sel.innerHTML = '';
                const placeholder = document.createElement('option');
                placeholder.value = '';
                placeholder.textContent = '-- select a store --';
                placeholder.disabled = true;
                placeholder.selected = true;
                sel.appendChild(placeholder);
                stores.forEach(s => {
                    const o = document.createElement('option');
                    o.value = s.key;
                    o.textContent = s.label + (s.subdomain ? ` (${s.subdomain})` : '');
                    sel.appendChild(o);
                });
                // No usage refresh needed
            } catch (err) {
                console.error('loadStores', err);
            }
        }
        loadStores();

        document.getElementById('danielleFormat').addEventListener('change', () => {
            if (fullResult) renderPreview(fullResult);
        });

        setJobControlState();

        // Column configuration removed; always show all columns returned by the server.
    </script>
</body>

</html>
